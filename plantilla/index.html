<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi agente que ve</title>
<style>
  :root{--fondo:#f4f1e6;--verde:#1e3d2f;--hoja:#3f7a55;--mango:#f0973a;--rojo:#c8553d;--suave:#5b6f62;--tarjeta:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--verde);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
  header{background:var(--verde);color:#fff;padding:28px 20px}
  header .contenedor{max-width:760px;margin:auto}
  header small{color:var(--mango);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem}
  h1{margin:4px 0 6px;font-size:1.9rem;line-height:1.15}
  header p{margin:0;opacity:.9}
  main{max-width:760px;margin:auto;padding:20px}
  .tarjeta{background:var(--tarjeta);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  h2{font-size:1.15rem;margin:0 0 12px}
  h2 span{display:inline-block;background:var(--mango);color:#fff;border-radius:999px;font-size:.75rem;padding:2px 10px;margin-right:8px;vertical-align:middle}
  label{display:block;font-weight:600;margin:12px 0 4px}
  label small{font-weight:400;color:var(--suave)}
  input,select{width:100%;padding:10px 12px;border:1.5px solid #cfd8c4;border-radius:10px;font-size:1rem;background:#fff;color:inherit}
  input:focus,select:focus{outline:none;border-color:var(--mango)}
  button{border:0;border-radius:999px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .principal{background:var(--mango);color:#fff;margin-top:16px;width:100%}
  .secundario{background:#e7ece0;color:var(--verde);padding:8px 16px;font-size:.9rem}
  .foto{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed #cfd8c4;border-radius:14px;padding:18px;cursor:pointer;font-weight:700;color:var(--hoja);background:#f8faf5}
  .foto input{display:none}
  #vista{display:none;max-width:100%;max-height:320px;border-radius:14px;margin:12px auto 0}
  .estado{font-size:.9rem;color:var(--suave);margin-top:8px}
  .barra{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-weight:600}
  .pista{height:16px;border-radius:999px;background:#e7ece0;overflow:hidden}
  .relleno{height:100%;background:var(--hoja);border-radius:999px}
  .barra.top .relleno{background:var(--mango)}
  .accion{border-left:6px solid var(--hoja);background:#f0f5ec;border-radius:10px;padding:12px 14px;margin:10px 0}
  .accion.aviso{border-color:var(--mango);background:#fdf3e7}
  .accion.alerta{border-color:var(--rojo);background:#fbecea}
  .accion b{display:block;font-size:1.05rem}
  .accion .porque{color:var(--suave);font-size:.9rem;margin-top:4px}
  .vacio{color:var(--suave)}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e3e8dc;vertical-align:top}
  td img{width:56px;height:56px;object-fit:cover;border-radius:8px}
  .fila-botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  footer{max-width:760px;margin:auto;padding:0 20px 30px;color:var(--suave);font-size:.85rem}
</style>
</head>
<body>
<header><div class="contenedor">
  <small id="carrera"></small>
  <h1 id="nombre"></h1>
  <p id="descripcion"></p>
</div></header>

<main>
  <section class="tarjeta">
    <h2><span>1 · Percibe</span>La foto y los datos</h2>
    <label class="foto"><input id="archivo" type="file" accept="image/*" capture="environment">📷 Tomar o subir una foto</label>
    <img id="vista" alt="Foto que analizará el agente">
    <form id="formulario"></form>
    <button class="principal" id="consultar" type="submit" form="formulario" disabled>Consultar al agente</button>
    <p class="estado" id="estado">Cargando el modelo…</p>
  </section>

  <section class="tarjeta">
    <h2><span>Lo que ve</span>Resultado del modelo</h2>
    <div id="ve"><p class="vacio">Toma una foto para ver qué reconoce el modelo.</p></div>
  </section>

  <section class="tarjeta">
    <h2><span>2 · Decide y actúa</span>Recomendación</h2>
    <div id="resultado"><p class="vacio">Aquí aparecerá lo que recomienda el agente.</p></div>
  </section>

  <section class="tarjeta">
    <h2><span>3 · Registra</span>Historial de consultas</h2>
    <div id="historial"><p class="vacio">Todavía no hay consultas.</p></div>
    <div class="fila-botones">
      <button class="secundario" id="descargar" type="button">Descargar historial (CSV)</button>
      <button class="secundario" id="borrar" type="button">Borrar historial</button>
    </div>
  </section>
</main>
<footer id="pie"></footer>

<script type="module">
// =====================================================================
// EDITA DESDE AQUÍ · Todo lo que hace tu agente está en este bloque
// =====================================================================
const AGENTE = {
  nombre: "Nombre de tu agente",
  carrera: "Tu carrera · IPA 204",
  descripcion: "Una frase: qué mira tu agente y qué decide.",
  autores: "Integrante 1 y Integrante 2",

  // EL MODELO: los «ojos» del agente.
  // Opción A (recomendada): tu modelo de Teachable Machine. Pega el enlace que te da
  //   «Exportar modelo → Subir mi modelo». Los nombres de las clases son los que pusiste allí.
  modelo: { tipo: "teachable", url: "https://teachablemachine.withgoogle.com/models/PEGA-AQUI-TU-ENLACE/" },
  // Opción B (plan B, sin entrenar): un modelo de Hugging Face que compara la foto con
  //   descripciones en inglés. Clave = nombre en español; valor = descripción en inglés.
  // modelo: { tipo: "clip", clases: { "Sana": "a photo of a healthy green leaf", "Con plaga": "a photo of a leaf damaged by pests" } },

  // DATOS EXTRA (opcional): otros datos que el agente pide además de la foto.
  // tipo "numero" (con min, max y unidad) u "opciones" (con una lista).
  entradas: [
    { id: "dias", etiqueta: "Un dato extra", tipo: "numero", min: 0, max: 30, unidad: "días" },
  ],

  // DECIDE: reglas «si… entonces». Se revisan todas, en orden. Las alertas se muestran primero.
  // Puedes usar:
  //   d.clase      → la clase que el modelo ve con más confianza (por ejemplo "Con plaga")
  //   d.confianza  → qué tan seguro está de esa clase, de 0 a 1
  //   d.prob["Nombre de clase"] → la confianza de cualquier clase, de 0 a 1
  //   d.dias (o el id de tus datos extra)
  // nivel: "ok", "aviso" o "alerta". porque: explica la regla en palabras sencillas.
  // detener: true (opcional) → si esta regla se cumple, no se revisan las siguientes.
  // entonces y porque pueden calcularse con los datos: (d) => `Confianza: ${Math.round(d.confianza * 100)} %`
  reglas: [
    {
      si: (d) => d.confianza < 0.6,
      entonces: "No estoy seguro: toma otra foto con mejor luz y más cerca.",
      nivel: "aviso",
      porque: (d) => `El modelo solo está ${Math.round(d.confianza * 100)} % seguro.`,
      detener: true,
    },
    {
      si: (d) => d.clase === "Clase 1",
      entonces: "Acción para la clase 1.",
      nivel: "ok",
      porque: "El modelo ve la clase 1.",
    },
  ],

  sinReglas: { entonces: "No tengo una recomendación para este caso.", porque: "Ninguna regla se activó." },
  limites: "Este agente da recomendaciones de apoyo. No reemplaza el criterio de una persona experta.",
};
// =====================================================================
// HASTA AQUÍ · No hace falta cambiar lo que sigue
// =====================================================================

const $ = (id) => document.getElementById(id);
const CLAVE = "historial-" + AGENTE.nombre;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x) => Math.round(x * 100) + " %";
let clasificar = null, fotoLista = false;

document.title = AGENTE.nombre;
$("nombre").textContent = AGENTE.nombre;
$("carrera").textContent = AGENTE.carrera;
$("descripcion").textContent = AGENTE.descripcion;
$("pie").textContent = AGENTE.limites + " · Hecho por " + AGENTE.autores + ".";

$("formulario").innerHTML = AGENTE.entradas.map((e) => {
  const etiqueta = `<label for="${e.id}">${esc(e.etiqueta)}${e.unidad ? ` <small>(${esc(e.unidad)})</small>` : ""}</label>`;
  if (e.tipo === "opciones") return etiqueta + `<select id="${e.id}" required>${e.opciones.map((o) => `<option>${esc(o)}</option>`).join("")}</select>`;
  return etiqueta + `<input id="${e.id}" type="number" step="any" required` +
    (e.min !== undefined ? ` min="${e.min}"` : "") + (e.max !== undefined ? ` max="${e.max}"` : "") + ">";
}).join("");

function cargarScript(src) {
  return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
}

async function cargarModelo() {
  const m = AGENTE.modelo;
  if (m.tipo === "teachable") {
    await cargarScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js");
    await cargarScript("https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js");
    const base = m.url.endsWith("/") ? m.url : m.url + "/";
    const modelo = await window.tmImage.load(base + "model.json", base + "metadata.json");
    return async (img) => (await modelo.predict(img)).map((p) => ({ clase: p.className.trim(), prob: p.probability }));
  }
  if (m.tipo === "clip") {
    const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2");
    const clip = await pipeline("zero-shot-image-classification", "Xenova/clip-vit-base-patch32");
    const nombres = Object.keys(m.clases), textos = Object.values(m.clases);
    return async (img) => (await clip(img.src, textos)).map((r) => ({ clase: nombres[textos.indexOf(r.label)], prob: r.score }));
  }
  throw new Error("Tipo de modelo desconocido: " + m.tipo);
}

function listo() { $("consultar").disabled = !(clasificar && fotoLista); }

cargarModelo().then((f) => {
  clasificar = f;
  $("estado").textContent = "Modelo listo. Toma o sube una foto.";
  listo();
}).catch((error) => {
  $("estado").textContent = "No se pudo cargar el modelo. Revisa el enlace o la conexión a internet. (" + error.message + ")";
});

$("archivo").addEventListener("change", () => {
  const archivo = $("archivo").files[0];
  if (!archivo) return;
  const lector = new FileReader();
  lector.onload = () => { $("vista").src = lector.result; $("vista").style.display = "block"; };
  lector.readAsDataURL(archivo);
  $("vista").onload = () => { fotoLista = true; listo(); };
});

function decidir(d) {
  const activas = [];
  const texto = (t) => (typeof t === "function" ? t(d) : t);
  for (const r of AGENTE.reglas) {
    try {
      if (r.si(d)) {
        activas.push({ ...r, entonces: texto(r.entonces), porque: texto(r.porque) });
        if (r.detener) break;
      }
    } catch (error) {
      activas.push({ entonces: "Error en una regla: revísala.", nivel: "alerta", porque: String(error) });
    }
  }
  const orden = { alerta: 0, aviso: 1, ok: 2 };
  activas.sort((a, b) => (orden[a.nivel] ?? 2) - (orden[b.nivel] ?? 2));
  return activas.length ? activas : [{ ...AGENTE.sinReglas, nivel: "ok" }];
}

function miniatura(img) {
  const c = document.createElement("canvas"), lado = 96;
  const r = Math.max(lado / img.naturalWidth, lado / img.naturalHeight);
  c.width = c.height = lado;
  c.getContext("2d").drawImage(img, (lado - img.naturalWidth * r) / 2, (lado - img.naturalHeight * r) / 2, img.naturalWidth * r, img.naturalHeight * r);
  return c.toDataURL("image/jpeg", 0.7);
}

function leerHistorial() { try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch { return []; } }

function mostrarHistorial() {
  const h = leerHistorial();
  if (!h.length) { $("historial").innerHTML = '<p class="vacio">Todavía no hay consultas.</p>'; return; }
  $("historial").innerHTML = `<table><tr><th>Foto</th><th>Fecha</th><th>Lo que vio</th>${AGENTE.entradas.map((e) => `<th>${esc(e.etiqueta)}</th>`).join("")}<th>Recomendación</th></tr>` +
    h.slice().reverse().map((f) => `<tr><td><img src="${f.foto}" alt=""></td><td>${esc(f.fecha)}</td><td>${esc(f.clase)} (${pct(f.confianza)})</td>${AGENTE.entradas.map((e) => `<td>${esc(f.datos[e.id])}</td>`).join("")}<td>${esc(f.acciones.join(" | "))}</td></tr>`).join("") + "</table>";
}

$("formulario").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("consultar").disabled = true;
  $("estado").textContent = "Mirando la foto…";
  try {
    const preds = (await clasificar($("vista"))).sort((a, b) => b.prob - a.prob);
    const d = { clase: preds[0].clase, confianza: preds[0].prob, prob: {} };
    preds.forEach((p) => { d.prob[p.clase] = p.prob; });
    const datos = {};
    for (const e of AGENTE.entradas) { const v = $(e.id).value; datos[e.id] = e.tipo === "numero" ? Number(v) : v; d[e.id] = datos[e.id]; }
    $("ve").innerHTML = preds.map((p, i) => `<div class="barra${i === 0 ? " top" : ""}"><span>${esc(p.clase)}</span><div class="pista"><div class="relleno" style="width:${p.prob * 100}%"></div></div><span>${pct(p.prob)}</span></div>`).join("");
    const acciones = decidir(d);
    $("resultado").innerHTML = acciones.map((a) => `<div class="accion ${a.nivel || "ok"}"><b>${esc(a.entonces)}</b><div class="porque">Por qué: ${esc(a.porque || "")}</div></div>`).join("");
    const h = leerHistorial();
    h.push({ fecha: new Date().toLocaleString("es-BO"), foto: miniatura($("vista")), clase: d.clase, confianza: d.confianza, datos, acciones: acciones.map((a) => a.entonces) });
    try { localStorage.setItem(CLAVE, JSON.stringify(h.slice(-30))); } catch { /* sin espacio: no se guarda */ }
    mostrarHistorial();
    $("estado").textContent = "Listo. Puedes probar con otra foto.";
  } catch (error) {
    $("estado").textContent = "Algo falló al analizar la foto: " + error.message;
  }
  listo();
});

$("descargar").addEventListener("click", () => {
  const h = leerHistorial();
  const celda = (t) => '"' + String(t).replace(/"/g, '""') + '"';
  const filas = [["Fecha", "Lo que vio", "Confianza", ...AGENTE.entradas.map((e) => e.etiqueta), "Recomendación"].map(celda).join(",")]
    .concat(h.map((f) => [f.fecha, f.clase, pct(f.confianza), ...AGENTE.entradas.map((e) => f.datos[e.id]), f.acciones.join(" | ")].map(celda).join(",")));
  const enlace = document.createElement("a");
  enlace.href = URL.createObjectURL(new Blob(["﻿" + filas.join("\n")], { type: "text/csv" }));
  enlace.download = "historial-agente.csv";
  enlace.click();
});

$("borrar").addEventListener("click", () => { localStorage.removeItem(CLAVE); mostrarHistorial(); });

mostrarHistorial();
</script>
</body>
</html>
